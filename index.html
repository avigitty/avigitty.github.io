<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ashvgk.in</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    height: 100vh;
    font-family: Arial, sans-serif;
    background: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow: hidden;
  }

  #title-wrap {
    margin: 40px 0 0;
    height: 80px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #t-left, #t-right {
    font-size: 56px;
    font-weight: 900;
    background: linear-gradient(90deg, #4285F4, #34A853);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    opacity: 0;
  }

  #dot-slot {
    display: inline-block;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: linear-gradient(135deg, #4285F4, #34A853);
    margin: 0 1px 0 2px;
    opacity: 0;
    vertical-align: middle;
    position: relative;
    top: 4px;
  }

  canvas { display: block; margin-top: -20px; }

  #search {
    margin-top: 16px;
    opacity: 0;
    transform: translateY(16px);
    transition: opacity 0.8s ease, transform 0.8s ease;
  }

  .search-box {
    display: flex;
    align-items: center;
    border: 1px solid #dfe1e5;
    border-radius: 24px;
    padding: 12px 18px;
    width: 420px;
    gap: 10px;
    background: #fff;
  }
  .search-box:focus-within {
    box-shadow: 0 1px 6px rgba(32,33,36,.28);
    border-color: transparent;
  }
  .search-box input {
    border: none;
    outline: none;
    font-size: 16px;
    width: 100%;
    background: transparent;
    color: #202124;
  }

  .search-btns {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-top: 16px;
  }
  .search-btns button {
    padding: 8px 18px;
    background: #f8f9fa;
    border: 1px solid #f8f9fa;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
    color: #3c4043;
  }
  .search-btns button:hover {
    border-color: #dadce0;
    box-shadow: 0 1px 2px rgba(0,0,0,.1);
  }
</style>
</head>
<body>

<div id="title-wrap">
  <span id="t-left">ashvgk</span>
  <span id="dot-slot"></span>
  <span id="t-right">in</span>
</div>

<canvas id="c" width="340" height="420"></canvas>

<div id="search">
  <div class="search-box">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9aa0a6" stroke-width="2">
      <circle cx="11" cy="11" r="8"/>
      <line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    <input type="text" id="gsearch" placeholder="Search Google" autofocus>
  </div>
  <div class="search-btns">
    <button onclick="doSearch()">Google Search</button>
    <button onclick="luckySearch()">I'm Feeling Lucky</button>
  </div>
</div>

<script>
  const canvas = document.getElementById('c');
  const ctx    = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  const startX = W / 2;
  const startY = H - 30;
  const R0     = 90;

  const gravity    = 900;
  const launchVY   = -820;
  const flipSpeed  = 8;

  // Target: dot position sits above canvas (~55px above top edge)
  const targetX = W / 2;
  const targetY = -55;

  // Solve for flight duration: 0.5g·t² + velY·t + (startY − targetY) = 0
  const a   = 0.5 * gravity;
  const bv  = launchVY;
  const cv  = startY - targetY;
  const disc = bv * bv - 4 * a * cv;
  const t1   = (-bv - Math.sqrt(disc)) / (2 * a);
  const t2   = (-bv + Math.sqrt(disc)) / (2 * a);
  const flightDuration = (Math.min(t1, t2) > 0) ? Math.min(t1, t2) : Math.max(t1, t2);
  const velX = (targetX - startX) / flightDuration;

  let coinX = startX, coinY = startY;
  let velY  = launchVY;
  let flipAngle = 0, R = R0;
  let totalTime = 0, last = null;

  // Load photo — falls back gracefully if missing
  const photo = new Image();
  photo.src   = 'photo_ashvgk_site.jpg';

  function drawCoin(x, y, r, flip) {
    if (!isFinite(r) || r < 1) return;
    const cosF = Math.cos(flip);
    const rx   = Math.max(1, r * Math.abs(cosF));
    const ry   = Math.max(1, r);
    if (rx < 1 || ry < 1) return;

    // Shadow — only visible near ground
    if (y > H * 0.55) {
      const dist = H - y;
      const ss   = Math.max(0.1, 1 - dist / (H * 0.5));
      ctx.save();
      ctx.translate(x, H - 22);
      ctx.beginPath();
      ctx.ellipse(0, 0, r * ss * 0.9, r * ss * 0.18, 0, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(0,0,0,${0.05 + 0.1 * ss})`;
      ctx.fill();
      ctx.restore();
    }

    ctx.save();
    ctx.translate(x, y);
    ctx.beginPath();
    ctx.ellipse(0, 0, Math.max(rx, 0.5), ry, 0, 0, Math.PI * 2);
    ctx.clip();

    // Photo or gradient fallback
    if (photo.complete && photo.naturalWidth > 0) {
      ctx.drawImage(photo, -r, -r, r * 2, r * 2);
      if (cosF < 0) {
        ctx.fillStyle = 'rgba(52,168,83,0.4)';
        ctx.fillRect(-r, -r, r * 2, r * 2);
      }
    } else {
      const grad = ctx.createRadialGradient(-rx * 0.3, -ry * 0.3, Math.max(0.1, ry * 0.05), 0, 0, Math.max(1, ry));
      if (cosF >= 0) {
        grad.addColorStop(0, '#74b8ff');
        grad.addColorStop(0.5, '#4285F4');
        grad.addColorStop(1, '#1a6e3c');
      } else {
        grad.addColorStop(0, '#a8d5a2');
        grad.addColorStop(0.5, '#34A853');
        grad.addColorStop(1, '#1a4a8a');
      }
      ctx.fillStyle = grad;
      ctx.fillRect(-r, -r, r * 2, r * 2);

      if (Math.abs(cosF) > 0.15 && r > 18) {
        ctx.fillStyle = 'rgba(255,255,255,0.92)';
        ctx.font = `bold ${Math.round(r * 0.65)}px Arial`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('A', 0, 0);
      }
    }

    // Shine sweep
    const sg = ctx.createLinearGradient(-rx, 0, rx, 0);
    sg.addColorStop(0, 'rgba(255,255,255,0)');
    sg.addColorStop(0.45, `rgba(255,255,255,${0.2 * Math.abs(cosF)})`);
    sg.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = sg;
    ctx.fillRect(-r, -r, r * 2, r * 2);

    ctx.restore();

    // Rim
    ctx.save();
    ctx.translate(x, y);
    ctx.beginPath();
    ctx.ellipse(0, 0, Math.max(rx, 0.5), ry, 0, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
    ctx.lineWidth   = 1.5;
    ctx.stroke();
    ctx.restore();
  }

  function loop(ts) {
    if (!last) last = ts;
    const dt = Math.min((ts - last) / 1000, 0.05);
    last = ts;
    totalTime += dt;

    ctx.clearRect(0, 0, W, H);

    // Ground line
    ctx.beginPath();
    ctx.moveTo(W / 2 - 150, H - 22);
    ctx.lineTo(W / 2 + 150, H - 22);
    ctx.strokeStyle = 'rgba(0,0,0,0.07)';
    ctx.lineWidth   = 1;
    ctx.stroke();

    velY      += gravity * dt;
    coinX     += velX * dt;
    coinY     += velY * dt;
    flipAngle += flipSpeed * dt;

    // Shrink: eases in fast near end so it snaps into the dot
    const progress   = Math.max(0, Math.min(1, totalTime / flightDuration));
    const shrinkEase = progress * progress * progress;
    R = Math.max(1, R0 * (1 - shrinkEase) + 7 * shrinkEase);

    if (totalTime >= flightDuration) {
      ctx.clearRect(0, 0, W, H);
      landInDot();
      return;
    }

    drawCoin(coinX, coinY, R, flipAngle);
    requestAnimationFrame(loop);
  }

  function landInDot() {
    canvas.style.display = 'none';

    const tLeft  = document.getElementById('t-left');
    const tRight = document.getElementById('t-right');
    const dot    = document.getElementById('dot-slot');

    // Text slides in from both sides
    tLeft.style.transform  = 'translateX(-14px)';
    tRight.style.transform = 'translateX(14px)';

    tLeft.style.transition  = 'opacity 0.4s ease, transform 0.4s ease';
    tRight.style.transition = 'opacity 0.4s ease, transform 0.4s ease';

    requestAnimationFrame(() => {
      tLeft.style.opacity    = '1';
      tLeft.style.transform  = 'translateX(0)';
      tRight.style.opacity   = '1';
      tRight.style.transform = 'translateX(0)';
    });

    // Dot pops in with overshoot bounce
    setTimeout(() => {
      dot.style.transform  = 'scale(0)';
      dot.style.opacity    = '1';
      dot.style.transition = 'opacity 0.1s ease, transform 0.25s cubic-bezier(0.3,1.8,0.5,1)';
      requestAnimationFrame(() => {
        dot.style.transform = 'scale(1)';
      });
    }, 260);

    // Search bar slides up
    setTimeout(() => {
      const s = document.getElementById('search');
      s.style.opacity   = '1';
      s.style.transform = 'translateY(0)';
    }, 950);
  }

  // Start animation — works with or without photo
  photo.onload  = () => requestAnimationFrame(loop);
  photo.onerror = () => requestAnimationFrame(loop);

  function doSearch() {
    const q = document.getElementById('gsearch').value.trim();
    if (q) window.location.href = 'https://www.google.com/search?q=' + encodeURIComponent(q);
  }
  function luckySearch() {
    const q = document.getElementById('gsearch').value.trim();
    if (q) window.location.href = 'https://www.google.com/search?q=' + encodeURIComponent(q) + '&btnI=1';
  }
  document.getElementById('gsearch').addEventListener('keydown', e => {
    if (e.key === 'Enter') doSearch();
  });
</script>

</body>
</html>
