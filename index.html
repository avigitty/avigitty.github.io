<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ashvgk.in</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    height: 100vh;
    font-family: Arial, sans-serif;
    background: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow: hidden;
  }
  #title-wrap {
    margin: 40px 0 0;
    height: 80px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #t-left, #t-right {
    font-size: 56px;
    font-weight: 900;
    background: linear-gradient(90deg, #4285F4, #34A853);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    opacity: 0;
  }
  #dot-slot {
    display: inline-block;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: linear-gradient(135deg, #4285F4, #34A853);
    margin: 0 1px 0 2px;
    opacity: 0;
    vertical-align: middle;
    position: relative;
    top: 4px;
  }
  canvas { display: block; margin-top: -20px; }
  #search {
    margin-top: 16px;
    opacity: 0;
    transform: translateY(16px);
    transition: opacity 0.8s ease, transform 0.8s ease;
  }
  .search-box {
    display: flex;
    align-items: center;
    border: 1px solid #dfe1e5;
    border-radius: 24px;
    padding: 12px 18px;
    width: 420px;
    gap: 10px;
    background: #fff;
  }
  .search-box:focus-within {
    box-shadow: 0 1px 6px rgba(32,33,36,.28);
    border-color: transparent;
  }
  .search-box input {
    border: none;
    outline: none;
    font-size: 16px;
    width: 100%;
    background: transparent;
    color: #202124;
  }
  .search-btns {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-top: 16px;
  }
  .search-btns button {
    padding: 8px 18px;
    background: #f8f9fa;
    border: 1px solid #f8f9fa;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
    color: #3c4043;
  }
  .search-btns button:hover {
    border-color: #dadce0;
    box-shadow: 0 1px 2px rgba(0,0,0,.1);
  }
</style>
</head>
<body>

<div id="title-wrap">
  <span id="t-left">ashvgk</span>
  <span id="dot-slot"></span>
  <span id="t-right">in</span>
</div>

<canvas id="c" width="340" height="420"></canvas>

<div id="search">
  <div class="search-box">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9aa0a6" stroke-width="2">
      <circle cx="11" cy="11" r="8"/>
      <line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    <input type="text" id="gsearch" placeholder="Search Google" autofocus>
  </div>
  <div class="search-btns">
    <button onclick="doSearch()">Google Search</button>
    <button onclick="luckySearch()">I'm Feeling Lucky</button>
  </div>
</div>

<script>
(function () {
  var canvas = document.getElementById('c');
  var ctx    = canvas.getContext('2d');
  var W = canvas.width;
  var H = canvas.height;

  var R0        = 90;
  var gravity   = 900;
  var launchVY  = -820;
  var flipSpeed = 8;
  var startX    = W / 2;
  var startY    = H - 30;
  var targetX   = W / 2;
  var targetY   = -55;

  var qa   = 0.5 * gravity;
  var qb   = launchVY;
  var qc   = startY - targetY;
  var disc = qb * qb - 4 * qa * qc;
  var sq   = Math.sqrt(disc > 0 ? disc : 0);
  var t1   = (-qb - sq) / (2 * qa);
  var t2   = (-qb + sq) / (2 * qa);
  var flightDuration = (t1 > 0 && t1 < t2) ? t1 : t2;
  var velX = 0; // startX === targetX so no horizontal movement needed

  var coinX = startX, coinY = startY;
  var velY  = launchVY;
  var flipAngle = 0, R = R0;
  var totalTime = 0, last = null;

  // Try loading photo — animation runs regardless
  var photo = new Image();
  var photoReady = false;
  photo.onload = function() { photoReady = true; };
  photo.onerror = function() { photoReady = false; };
  photo.src = 'photo_ashvgk_site.jpg';

  function drawCoin(x, y, r, flip) {
    var sr   = r < 2 ? 2 : r;
    var cosF = Math.cos(flip);
    var absC = cosF < 0 ? -cosF : cosF;
    var rx   = sr * absC;
    if (rx < 1.5) rx = 1.5;
    var ry   = sr;

    // Ground shadow
    if (y > H * 0.55) {
      var pct = (y - H * 0.55) / (H * 0.45);
      if (pct > 1) pct = 1;
      ctx.save();
      ctx.translate(x, H - 22);
      ctx.beginPath();
      var ew = sr * pct * 0.85;
      var eh = sr * pct * 0.15;
      if (eh < 0.5) eh = 0.5;
      ctx.ellipse(0, 0, ew, eh, 0, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(0,0,0,' + (0.08 * pct) + ')';
      ctx.fill();
      ctx.restore();
    }

    // Coin face
    ctx.save();
    ctx.translate(x, y);
    ctx.beginPath();
    ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
    ctx.clip();

    if (photoReady) {
      ctx.drawImage(photo, -sr, -sr, sr * 2, sr * 2);
      if (cosF < 0) {
        ctx.fillStyle = 'rgba(52,168,83,0.38)';
        ctx.fillRect(-sr, -sr, sr * 2, sr * 2);
      }
    } else {
      var inner = sr * 0.05;
      if (inner < 0.1) inner = 0.1;
      var outer = sr;
      if (outer < inner + 0.1) outer = inner + 0.1;
      var grad = ctx.createRadialGradient(-rx * 0.25, -ry * 0.25, inner, 0, 0, outer);
      if (cosF >= 0) {
        grad.addColorStop(0,   '#74b8ff');
        grad.addColorStop(0.5, '#4285F4');
        grad.addColorStop(1,   '#1a6e3c');
      } else {
        grad.addColorStop(0,   '#a8d5a2');
        grad.addColorStop(0.5, '#34A853');
        grad.addColorStop(1,   '#1a4a8a');
      }
      ctx.fillStyle = grad;
      ctx.fillRect(-sr, -sr, sr * 2, sr * 2);

      if (absC > 0.15 && sr > 20) {
        ctx.fillStyle    = 'rgba(255,255,255,0.92)';
        ctx.font         = 'bold ' + Math.round(sr * 0.62) + 'px Arial';
        ctx.textAlign    = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('A', 0, 0);
      }
    }

    // Shine
    var sg = ctx.createLinearGradient(-rx, 0, rx, 0);
    sg.addColorStop(0,    'rgba(255,255,255,0)');
    sg.addColorStop(0.45, 'rgba(255,255,255,' + (0.18 * absC) + ')');
    sg.addColorStop(1,    'rgba(255,255,255,0)');
    ctx.fillStyle = sg;
    ctx.fillRect(-sr, -sr, sr * 2, sr * 2);
    ctx.restore();

    // Rim
    ctx.save();
    ctx.translate(x, y);
    ctx.beginPath();
    ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(255,255,255,0.28)';
    ctx.lineWidth   = 1.5;
    ctx.stroke();
    ctx.restore();
  }

  function loop(ts) {
    if (!last) last = ts;
    var dt = (ts - last) / 1000;
    if (dt > 0.05) dt = 0.05;
    last = ts;
    totalTime += dt;

    ctx.clearRect(0, 0, W, H);

    // Subtle ground line
    ctx.beginPath();
    ctx.moveTo(W / 2 - 140, H - 22);
    ctx.lineTo(W / 2 + 140, H - 22);
    ctx.strokeStyle = 'rgba(0,0,0,0.07)';
    ctx.lineWidth   = 1;
    ctx.stroke();

    velY      += gravity * dt;
    coinY     += velY * dt;
    flipAngle += flipSpeed * dt;

    var progress = totalTime / flightDuration;
    if (progress > 1) progress = 1;
    if (progress < 0) progress = 0;
    var ease = progress * progress * progress;
    R = R0 * (1 - ease) + 7 * ease;
    if (R < 2) R = 2;

    if (totalTime >= flightDuration) {
      ctx.clearRect(0, 0, W, H);
      landInDot();
      return;
    }

    drawCoin(coinX, coinY, R, flipAngle);
    requestAnimationFrame(loop);
  }

  function landInDot() {
    canvas.style.display = 'none';

    var tLeft  = document.getElementById('t-left');
    var tRight = document.getElementById('t-right');
    var dot    = document.getElementById('dot-slot');

    tLeft.style.transform   = 'translateX(-16px)';
    tRight.style.transform  = 'translateX(16px)';
    tLeft.style.transition  = 'opacity 0.4s ease, transform 0.4s ease';
    tRight.style.transition = 'opacity 0.4s ease, transform 0.4s ease';

    requestAnimationFrame(function() {
      requestAnimationFrame(function() {
        tLeft.style.opacity    = '1';
        tLeft.style.transform  = 'translateX(0)';
        tRight.style.opacity   = '1';
        tRight.style.transform = 'translateX(0)';
      });
    });

    setTimeout(function() {
      dot.style.opacity    = '1';
      dot.style.transform  = 'scale(0)';
      dot.style.transition = 'opacity 0.1s ease, transform 0.28s cubic-bezier(0.25,1.8,0.5,1)';
      requestAnimationFrame(function() {
        requestAnimationFrame(function() {
          dot.style.transform = 'scale(1)';
        });
      });
    }, 280);

    setTimeout(function() {
      var s = document.getElementById('search');
      s.style.opacity   = '1';
      s.style.transform = 'translateY(0)';
    }, 980);
  }

  requestAnimationFrame(loop);

})();

function doSearch() {
  var q = document.getElementById('gsearch').value.trim();
  if (q) window.location.href = 'https://www.google.com/search?q=' + encodeURIComponent(q);
}
function luckySearch() {
  var q = document.getElementById('gsearch').value.trim();
  if (q) window.location.href = 'https://www.google.com/search?q=' + encodeURIComponent(q) + '&btnI=1';
}
document.getElementById('gsearch').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') doSearch();
});
</script>

</body>
</html>
